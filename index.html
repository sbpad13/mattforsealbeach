  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 footer .brand .wm-terry{color:var(--m-red);}\n  .nav-links{display:flex;gap:34px;margin:0 auto;}\n  .nav-links a{font-family:var(--fmono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:rgb(var(--c-fgdim));padding:6px 0;transition:color .15s;}\n  .nav-links a:hover{color:var(--ink);}\n  .btn{font-family:var(--fdisp);font-weight:700;font-size:14px;letter-spacing:.01em;text-decoration:none;border:none;cursor:pointer;\n       padding:11px 20px;border-radius:6px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,box-shadow .12s,background .15s;white-space:nowrap;}\n  .btn-gold{background:var(--teal);color:var(--sand);box-shadow:0 6px 16px -10px rgba(var(--c-teal),.7);}\n  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 9px 20px -10px rgba(var(--c-teal),.85);}\n  .btn:active{transform:translateY(1px) scale(.99);}\n  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(var(--c-line),.32);}\n  .btn-ghost:hover{border-color:var(--ink);background:rgba(var(--c-line),.05);}\n  .btn-sand{background:var(--sand);color:var(--ink);} .btn-sand:hover{transform:translateY(-1px);}\n  .progress{height:2px;background:var(--teal);width:0;transition:width .1s linear;position:relative;}\n  .nav .btn{margin-left:4px;}\n\n  /* language toggle */\n  .langtoggle{display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(var(--c-line),.25);background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer;font-family:var(--fmono);font-size:11px;letter-spacing:.08em;font-weight:600;color:rgb(var(--c-fgdim));transition:border-color .15s;}\n  .langtoggle:hover{border-color:var(--ink);}\n  .langtoggle .on{color:var(--ink);} .langtoggle .off{color:#a39a88;}\n  html[lang=\"es\"] .langtoggle .on{color:#a39a88;} html[lang=\"es\"] .langtoggle .off{color:var(--ink);}\n  .langtoggle .on::after{content:\" / \";color:#a39a88;}\n  .langtoggle.ml{margin:8px 32px 24px;width:calc(100% - 64px);justify-content:center;padding:12px;}\n\n  /* accessibility: visible focus everywhere */\n  a:focus-visible,button:focus-visible,input:focus-visible,.pcard:focus-visible,[tabindex]:focus-visible{\n    outline:3px solid var(--teal);outline-offset:3px;border-radius:4px;}\n  .skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--ink);color:var(--sand);padding:12px 18px;border-radius:0 0 8px 0;font-family:var(--fmono);font-size:12px;text-decoration:none;}\n  .skip:focus{left:0;}\n  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}\n\n  /* mobile hamburger */\n  .menu-toggle{display:none;margin-left:auto;width:42px;height:42px;border-radius:10px;border:1.5px solid rgba(var(--c-line),.25);background:transparent;cursor:pointer;padding:0;align-items:center;justify-content:center;}\n  .menu-toggle span{display:block;width:18px;height:2px;background:var(--ink);position:relative;transition:transform .25s,opacity .2s;}\n  .menu-toggle span::before,.menu-toggle span::after{content:\"\";position:absolute;left:0;width:18px;height:2px;background:var(--ink);transition:transform .25s;}\n  .menu-toggle span::before{top:-6px;}.menu-toggle span::after{top:6px;}\n  .menu-toggle[aria-expanded=\"true\"] span{background:transparent;}\n  .menu-toggle[aria-expanded=\"true\"] span::before{transform:translateY(6px) rotate(45deg);}\n  .menu-toggle[aria-expanded=\"true\"] span::after{transform:translateY(-6px) rotate(-45deg);}\n  .mobile-menu{position:fixed;inset:64px 0 auto 0;z-index:48;background:var(--sand);border-bottom:1px solid rgba(var(--c-line),.14);\n    transform:translateY(-120%);transition:transform .32s cubic-bezier(.4,.0,.2,1);box-shadow:0 20px 40px -24px rgba(40,38,30,.5);}\n  .mobile-menu.open{transform:translateY(0);}\n  .mobile-menu a{display:block;padding:18px 32px;font-family:var(--fdisp);font-weight:700;font-size:20px;text-decoration:none;color:var(--ink);border-top:1px solid rgba(var(--c-line),.1);}\n  .mobile-menu a:first-child{border-top:none;}\n  .mobile-menu .btn{margin:18px 32px 24px;display:flex;justify-content:center;}\n\n  /* sticky 'get a sign' bar (mobile) */\n  .sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:46;background:rgb(var(--c-panel));padding:12px 16px calc(12px + env(safe-area-inset-bottom));\n    display:none;align-items:center;gap:12px;transform:translateY(120%);transition:transform .3s ease;box-shadow:0 -10px 30px -16px rgba(0,0,0,.5);}\n  .sticky-cta.show{transform:translateY(0);}\n  .sticky-cta .lbl{color:rgb(var(--c-ondark));font-family:var(--fdisp);font-weight:700;font-size:14px;flex:1;line-height:1.2;}\n  .sticky-cta .lbl small{display:block;font-family:var(--fmono);font-weight:400;font-size:10px;letter-spacing:.08em;color:rgba(var(--c-ondark),.6);text-transform:uppercase;margin-top:2px;}\n\n  /* ---------- HERO ---------- */\n  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;position:relative;padding-top:64px;overflow:hidden;\n        background:linear-gradient(180deg, #f1ebdf 0%, #efe6d0 38%, #ecddc4 60%, #ecd2ac 80%, #ead0a6 100%);}\n  /* sky scrim — a faint warm/cool wash tinted by JS as you scroll the district */\n  #skyscrim{position:fixed;inset:0;z-index:45;pointer-events:none;transition:background 1.2s linear;background:transparent;mix-blend-mode:multiply;}\n  .sun{position:fixed;right:12vw;top:18vh;width:120px;height:120px;border-radius:50%;z-index:44;pointer-events:none;\n       background:radial-gradient(circle, rgba(var(--c-red),.5), rgba(var(--c-red),0) 70%);opacity:0;transition:opacity 1.2s linear, top 1.4s linear;}\n  .hero-top{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 32px 24px;gap:2px;}\n  .hero .kicker{margin-bottom:26px;}\n  .hero h1{font-weight:900;font-size:clamp(40px,10.5vw,128px);letter-spacing:-.025em;text-transform:uppercase;color:var(--ink);white-space:nowrap;}\n  .hero .tagline{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:13px;white-space:nowrap;}\n  /* tier 1 — the office he's running for. Default: quiet MONO locator, echoing the yard sign's council band (ink, wide-tracked mono) so the wordmark stays the sole display element. */\n  .hero .tag-role{font-family:var(--fmono);font-weight:500;font-size:clamp(13px,1.75vw,18px);letter-spacing:.28em;text-transform:uppercase;color:rgb(var(--c-fg));text-indent:.28em;}\n  .hero .tag-role .tag-dot{color:var(--gold);font-weight:500;margin:0 .18em;}\n  /* alternate: the original brand-teal display line */\n  body[data-councilstyle=\"display\"] .hero .tag-role{font-family:var(--fdisp);font-weight:700;font-size:clamp(15px,2vw,23px);letter-spacing:.13em;color:var(--teal);text-indent:0;}\n  body[data-councilstyle=\"display\"] .hero .tag-role .tag-dot{color:var(--m-red);font-weight:700;margin:0 .12em;}\n  /* tier 2 — the neighborhoods: quiet mono locator (matches the .kicker label vocabulary) */\n  .hero .tag-place{font-family:var(--fmono);font-weight:500;font-size:clamp(9.5px,1.05vw,11px);letter-spacing:.32em;text-transform:uppercase;color:rgb(var(--c-fgsoft));text-indent:.32em;display:flex;align-items:center;gap:.55em;}\n  .hero .tag-place::before,.hero .tag-place::after{content:\"\";width:clamp(14px,3vw,30px);height:1px;background:rgba(var(--c-fgsoft),.6);}\n  /* flanking rules draw in from the text outward, and only after the place line has finished appearing */\n  .hero .tag-place::before{transform-origin:right center;}\n  .hero .tag-place::after{transform-origin:left center;}\n  .hero.ent-armed .hero-top .tag-place::before,.hero.ent-armed .hero-top .tag-place::after{transform:scaleX(0);}\n  @keyframes ruleDraw{0%{transform:scaleX(0);}100%{transform:scaleX(1);}}\n  .hero .tag-place .tag-slash{color:var(--gold);margin:0 .1em;}\n  /* night-only luminance shimmer on the place line: a warm highlight sweeps the glyphs, its brightness gated by --tnight so it's invisible in daylight and fades in through dusk */\n  .hero .tag-lbl{color:transparent;-webkit-background-clip:text;background-clip:text;\n    background-image:linear-gradient(100deg, rgb(var(--c-fgsoft)) 38%, color-mix(in srgb, #fff3d2 calc(var(--tnight,0)*88%), rgb(var(--c-fgsoft))) 50%, rgb(var(--c-fgsoft)) 62%);\n    background-size:230% 100%;animation:tagShimmer 5.5s linear infinite;}\n  @keyframes tagShimmer{0%{background-position:130% 0}100%{background-position:-130% 0}}\n  html:not(.is-night) .hero .tag-lbl{animation-play-state:paused;} /* shimmer is invisible in daylight — stop compositing it */\n  .hero-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;justify-content:center;}\n  .trust{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;}\n  .trust span{font-family:var(--fmono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgb(var(--c-fgdim));background:rgba(var(--c-glass),.5);border:1px solid rgba(var(--c-line),.16);border-radius:999px;padding:7px 14px;}\n  .trust span .ph{color:var(--teal);}\n  .hero-pano-wrap{position:relative;width:100%;margin-bottom:38px;}\n  #hero-pano{width:100%;height:auto;display:block;clip-path:inset(0 0 0 0);}\n  .draw #hero-pano{clip-path:none;}\n  .draw:not(.ready) .hero-pano-wrap::before{content:none;}\n  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}\n  .draw.ready #hero-pano{clip-path:none;}\n  .scrollcue{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:2;font-family:var(--fmono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgb(var(--c-fgdim));display:flex;flex-direction:column;align-items:center;gap:6px;}\n  .scrollcue .dot{width:1px;height:26px;background:linear-gradient(var(--ink),transparent);animation:cue 1.8s ease-in-out infinite;}\n  @keyframes cue{0%,100%{opacity:.3;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}\n\n  .hero-hint{margin-top:14px;font-family:var(--fmono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--c-fgdim));display:flex;align-items:center;gap:8px;justify-content:center;}\n  .hero-hint i{width:9px;height:9px;border-radius:50%;background:var(--gray);box-shadow:0 0 0 0 rgba(154,148,138,.6);animation:hintpulse 2.4s ease-out infinite;}\n  @keyframes hintpulse{0%{box-shadow:0 0 0 0 rgba(var(--c-teal),.5)}70%{box-shadow:0 0 0 9px rgba(var(--c-teal),0)}100%{box-shadow:0 0 0 0 rgba(var(--c-teal),0)}}\n\n  /* ============ HERO TITLE ENTRANCES (Tweaks · Title entrance) — fire after the panorama draws in ============ */\n  .hero-top h1 .ch{display:inline-block;will-change:transform,opacity,filter;}\n  .hero-top h1{position:relative;}\n  .hero-top{--glow:#ffe6ad;}\n  .hero.ent-go .hero-top{--glow:color-mix(in srgb, #ffe6ad calc((1 - var(--tnight,0))*100%), #bcd8ff);}\n  /* armed = hidden start state, set once JS takes over (no-JS keeps text visible) */\n  .hero.ent-armed .hero-top h1 .ch,\n  .hero.ent-armed .hero-top .tag-role,\n  .hero.ent-armed .hero-top .tag-place{opacity:0;}\n  /* A · Sunlight ignition — each letter fires from silhouette to full colour, a light sweeps across */\n  @keyframes chIgnite{0%{opacity:0;filter:brightness(.22) saturate(.35);transform:translateY(.08em) scale(.98);}\n    45%{opacity:1;}\n    60%{filter:brightness(1.9) saturate(1.25);text-shadow:0 0 22px var(--glow),0 0 8px var(--glow);}\n    100%{opacity:1;filter:none;text-shadow:none;transform:none;}}\n  .hero.ent-go[data-entrance=\"ignite\"] .hero-top h1 .ch{animation:chIgnite .85s cubic-bezier(.2,.7,.2,1) both, chGlint 1.5s ease-in-out both;animation-delay:calc(var(--i,0)*.05s), calc(var(--chN,8)*.05s + 1.9s + var(--i,0)*.08s);}\n  @keyframes lineWash{0%{opacity:0;transform:translateY(.5em);filter:blur(3px);}100%{opacity:1;transform:none;filter:blur(0);}}\n  .hero.ent-go[data-entrance=\"ignite\"] .hero-top .tag-role{animation:lineWash .7s ease-out both;animation-delay:calc(var(--chN,8)*.05s + .5s);}\n  .hero.ent-go[data-entrance=\"ignite\"] .hero-top .tag-place{animation:lineWash .7s ease-out both;animation-delay:calc(var(--chN,8)*.05s + .66s);}\n  .hero.ent-go[data-entrance=\"ignite\"] .hero-top h1::before{content:\"\";position:absolute;top:-8%;bottom:-8%;left:0;width:34%;pointer-events:none;z-index:2;\n    background:linear-gradient(100deg,transparent, color-mix(in srgb,var(--glow) 72%,transparent), transparent);mix-blend-mode:screen;filter:blur(5px);animation:titleSweep 1.05s ease-in both;}\n  @keyframes titleSweep{0%{transform:translateX(-140%);opacity:0;}18%{opacity:1;}100%{transform:translateX(320%);opacity:0;}}\n  /* night wordmark glint removed per request — keyframe is a no-op so the entrance timing slots stay intact */\n  @keyframes chGlint{0%,50%,100%{filter:none;text-shadow:none;}}\n  /* B · Rise from the horizon — each line lifts up with an overshoot settle + motion blur */\n  @keyframes lineRise{0%{opacity:0;transform:translateY(1.15em) scale(.965);filter:blur(7px);}\n    58%{opacity:1;filter:blur(0);}\n    76%{transform:translateY(-.07em);}\n    100%{opacity:1;transform:none;filter:blur(0);}}\n  .hero.ent-armed[data-entrance=\"rise\"] .hero-top h1 .ch{opacity:1;}\n  .hero.ent-armed[data-entrance=\"rise\"] .hero-top h1{opacity:0;}\n  .hero.ent-go[data-entrance=\"rise\"] .hero-top h1{animation:lineRise 1s cubic-bezier(.18,.9,.24,1.05) both;}\n  .hero.ent-go[data-entrance=\"rise\"] .hero-top h1 .ch{opacity:1;animation:chGlint 1.5s ease-in-out both;animation-delay:calc(1.4s + var(--i,0)*.08s);}\n  .hero.ent-go[data-entrance=\"rise\"] .hero-top .tag-role{animation:lineRise .9s cubic-bezier(.18,.9,.24,1.05) both;animation-delay:.16s;}\n  .hero.ent-go[data-entrance=\"rise\"] .hero-top .tag-place{animation:lineRise .9s cubic-bezier(.18,.9,.24,1.05) both;animation-delay:.28s;}\n  /* C · Typewriter — letters appear one at a time behind a blinking caret; the mono lines type in after */\n  .hero.ent-armed[data-entrance=\"pen\"] .hero-top h1 .ch{opacity:0;}\n  .hero.ent-armed[data-entrance=\"pen\"] .hero-top h1{opacity:1;}\n  .hero.ent-armed[data-entrance=\"pen\"] .hero-top .tag-role,\n  .hero.ent-armed[data-entrance=\"pen\"] .hero-top .tag-place{opacity:1;clip-path:inset(0 100% 0 0);}\n  @keyframes chType{0%{opacity:0;transform:translateY(.04em);}100%{opacity:1;transform:none;}}\n  @keyframes typeWipe{0%{clip-path:inset(0 100% 0 0);}100%{clip-path:inset(0 -1% 0 0);}}\n  /* each letter eases in over its own window, overlapping its neighbours slightly, so the run flows instead of ticking */\n  .hero.ent-go[data-entrance=\"pen\"] .hero-top h1 .ch{animation:chType .28s cubic-bezier(.22,.61,.36,1) both, chGlint 1.5s ease-in-out both;animation-delay:calc(var(--i,0)*.06s), calc(var(--chN,8)*.06s + 1.9s + var(--i,0)*.08s);}\n  .hero.ent-go[data-entrance=\"pen\"] .hero-top .tag-role{animation:typeWipe .6s steps(24,end) both;animation-delay:calc(var(--chN,8)*.06s + .35s);opacity:1;}\n  .hero.ent-go[data-entrance=\"pen\"] .hero-top .tag-place{animation:typeWipe .55s steps(20,end) both;animation-delay:calc(var(--chN,8)*.06s + .9s);opacity:1;}\n  /* flanking rules finish last, drawn from the text outward, per entrance */\n  .hero.ent-go[data-entrance=\"pen\"] .hero-top .tag-place::before,.hero.ent-go[data-entrance=\"pen\"] .hero-top .tag-place::after{animation:ruleDraw .5s ease-out both;animation-delay:calc(var(--chN,8)*.06s + 1.5s);}\n  .hero.ent-go[data-entrance=\"ignite\"] .hero-top .tag-place::before,.hero.ent-go[data-entrance=\"ignite\"] .hero-top .tag-place::after{animation:ruleDraw .5s ease-out both;animation-delay:calc(var(--chN,8)*.05s + 1.4s);}\n  .hero.ent-go[data-entrance=\"rise\"] .hero-top .tag-place::before,.hero.ent-go[data-entrance=\"rise\"] .hero-top .tag-place::after{animation:ruleDraw .5s ease-out both;animation-delay:1.25s;}\n\n  /* district 'you are here' rail (desktop) */\n  .rail{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:47;display:flex;flex-direction:column;gap:2px;align-items:flex-end;}\n  .rail a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:5px 0;color:rgb(var(--c-fgdim));font-family:var(--fmono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;transition:color .2s;}\n  .rail a .rdot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;transition:background .2s,transform .2s,border-color .2s;}\n  .rail a .rlabel{opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s;white-space:nowrap;}\n  .rail a:hover .rlabel,.rail a.active .rlabel{opacity:1;transform:none;}\n  .rail a.active{color:var(--ink);}\n  .rail a.active .rdot{background:var(--m-red);border-color:var(--m-red);transform:scale(1.35);}\n  @media(max-width:980px){.rail{display:none;}}\n\n  /* ---------- SECTIONS ---------- */\n  section{padding:104px 0;position:relative;}\n  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px;}\n  .sec-num{font-family:var(--fmono);font-size:13px;letter-spacing:.1em;color:var(--m-red);font-weight:600;}\n  .sec-label{font-family:var(--fmono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgb(var(--c-fgdim));}\n  .sec-motif{max-width:460px;margin:0 0 30px;opacity:.92;}\n  /* motifs draw themselves in when their section reveals */\n  .sec-motif .pano{clip-path:inset(0 100% 0 0);}\n  .sec-motif.in .pano{clip-path:inset(0 0 0 0);transition:clip-path 1.5s cubic-bezier(.6,.02,.2,1) .15s;}\n  h2.big{font-weight:800;font-size:clamp(34px,5.2vw,62px);letter-spacing:-.02em;max-width:14ch;text-wrap:pretty;margin-bottom:4px;}\n\n  .reveal{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);}\n  .reveal.in{opacity:1;transform:none;}\n\n  /* Pier / Meet */\n  .meet{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start;}\n  .meet .lede{font-size:19px;line-height:1.65;color:rgb(var(--c-fgsoft));margin-top:22px;}\n  .meet p.body{margin-top:18px;color:rgb(var(--c-fgsoft));font-size:15.5px;}\n  .why{margin:26px 0 0;padding:18px 22px;border-left:3px solid var(--m-red);background:rgba(var(--c-glass),.4);border-radius:0 10px 10px 0;}\n  .why .ph{font-family:var(--fdisp);font-weight:500;font-size:19px;line-height:1.45;color:var(--m-red);font-style:normal;}\n  .why cite{display:block;margin-top:10px;font-family:var(--fmono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--c-fgdim));font-style:normal;}\n  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px;}\n  .stat{background:rgba(var(--c-glass),.5);border:1px solid rgba(var(--c-line),.12);border-radius:10px;padding:14px 18px;min-width:120px;}\n  .stat b{font-family:var(--fdisp);font-weight:800;font-size:28px;display:block;color:var(--ink);}\n  .stat span{font-family:var(--fmono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgb(var(--c-fgdim));}\n  image-slot{width:100%;height:480px;display:block;border-radius:16px;}\n  /* intentional empty state for photo slots */\n  .photo-frame{position:relative;border-radius:16px;background:\n    repeating-linear-gradient(135deg,rgba(var(--c-line),.035) 0 12px,transparent 12px 24px),\n    linear-gradient(160deg,#ece4d3,#e2d8c4);box-shadow:inset 0 0 0 1px rgba(var(--c-line),.12);}\n  .ecard image-slot{box-shadow:inset 0 0 0 1px rgba(var(--c-line),.18);background:linear-gradient(160deg,#dcdcc4,#c9caac);}\n  .meet-photo{display:block;width:100%;aspect-ratio:15/17;object-fit:cover;object-position:center bottom;border-radius:16px;}\n  .photo-frame .tag{position:absolute;left:14px;bottom:14px;background:var(--ink);color:var(--sand);font-family:var(--fmono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:6px;}\n\n  /* Main Street / priorities */\n  .mainstreet{background:var(--sand2);}\n  .pri{display:grid;grid-template-columns:1fr;gap:18px;margin-top:42px;}\n  .pcard{background:var(--sand);border:1px solid rgba(var(--c-line),.13);border-radius:16px;padding:30px 32px;cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s;}\n  .pcard:hover{box-shadow:0 18px 40px -28px rgba(40,38,30,.5);border-color:rgba(var(--c-line),.28);transform:translateY(-3px);}\n  .pcard .top{display:flex;align-items:flex-start;gap:22px;}\n  .pcard .idx{font-family:var(--fmono);font-size:13px;color:var(--teal);font-weight:600;padding-top:8px;}\n  .pcard h3{font-weight:700;font-size:clamp(22px,2.8vw,30px);flex:1;}\n  .pcard .one{font-size:16px;color:rgb(var(--c-fgsoft));margin-top:8px;}\n  .pcard .plus{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(var(--c-line),.3);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .25s,background .2s;font-size:20px;line-height:1;color:var(--ink);}\n  .pcard.open .plus{transform:rotate(45deg);background:var(--teal);border-color:var(--teal);}\n  .pcard .more{max-height:0;overflow:hidden;opacity:0;transition:max-height .42s cubic-bezier(.4,0,.2,1),opacity .3s ease .06s;}\n  .pcard .more p{padding-top:18px;color:rgb(var(--c-fgsoft));font-size:15.5px;max-width:62ch;}\n  .pcard.open .more{max-height:260px;opacity:1;}\n\n  /* Endorsements */\n  .endorse{background:var(--sand2);padding-top:0;}\n  .equote{columns:2;column-gap:30px;margin-top:30px;}\n  @media(max-width:760px){.equote{columns:1;}}\n  .ecard{break-inside:avoid;background:var(--sand);border:1px solid rgba(var(--c-line),.12);border-radius:14px;padding:24px 26px;margin-bottom:18px;transition:transform .2s,box-shadow .2s;}\n  .ecard:hover{transform:translateY(-3px);box-shadow:0 16px 38px -28px rgba(40,38,30,.5);}\n  .ecard p{font-size:16px;color:rgb(var(--c-fgsoft));font-style:italic;}\n  .ecard .who{display:flex;align-items:center;gap:12px;margin-top:16px;}\n  .ecard .av{width:46px;height:46px;border-radius:50%;background:var(--m-people);color:#2a2a1f;display:flex;align-items:center;justify-content:center;font-family:var(--fdisp);font-weight:700;font-size:15px;flex:none;overflow:hidden;}\n  .ecard image-slot{width:46px;height:46px;flex ),.9);background:rgba(var(--c-ondark),.08);border:1px solid rgba(var(--c-ondark),.18);border-radius:10px;padding:11px 14px;}\n  .signjoin b{color:var(--m-red);font-size:15px;}\n  .field{margin-top:16px;}\n  .field label{display:block;font-family:var(--fmono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--c-ondark),.75);margin-bottom:6px;}\n  .field input{width:100%;background:rgba(var(--c-ondark),.1);border:1px solid rgba(var(--c-ondark),.28);border-radius:10px;padding:13px 15px;color:rgb(var(--c-ondark));font-family:var(--fbody);font-size:15px;}\n  .field input::placeholder{color:rgba(var(--c-ondark),.45);}\n  .field input:focus{outline:none;border-color:rgba(var(--c-ondark),.85);background:rgba(var(--c-ondark),.16);box-shadow:0 0 0 3px rgba(var(--c-ondark),.2);}\n  .signcard .btn{margin-top:22px;width:100%;justify-content:center;}\n  .signrow{display:flex;gap:10px;margin-top:18px;}\n  .signrow input{flex:1;min-width:0;background:rgba(var(--c-ondark),.1);border:1px solid rgba(var(--c-ondark),.28);border-radius:8px;padding:13px 15px;color:rgb(var(--c-ondark));font-family:var(--fbody);font-size:15px;}\n  .signrow input::placeholder{color:rgba(var(--c-ondark),.5);}\n  .signrow input:focus{outline:none;border-color:rgba(var(--c-ondark),.85);background:rgba(var(--c-ondark),.16);box-shadow:0 0 0 3px rgba(var(--c-ondark),.18);}\n  .signrow .signbtn{flex:none;margin-top:0;width:auto;background:var(--sand);color:var(--teal-d);box-shadow:0 6px 16px -10px rgba(0,0,0,.5);}\n  .signrow .signbtn:hover{transform:translateY(-1px);background:#fff;}\n  .contact{background:var(--sand2);border:1px solid rgba(var(--c-line),.13);border-radius:16px;padding:24px 26px 22px;}\n  .contact h4{font-family:var(--fdisp);font-weight:800;font-size:22px;margin:0;color:var(--ink);}\n  .contact .cnote{font-size:14.5px;color:rgb(var(--c-fgdim));margin:6px 0 8px;line-height:1.5;}\n  .crow{display:flex;align-items:center;gap:14px;padding:14px 0;text-decoration:none;color: 2px);box-shadow:0 16px 36px -26px rgba(40,38,30,.5);border-color:rgba(var(--c-line),.28);}\n  .way .ic{width:42px;height:42px;border-radius:10px;background:rgb(var(--c-panelteal));color:rgb(var(--c-ondark));display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s,color .2s,transform .2s;}\n  .way:hover .ic{background:var(--teal);color:var(--sand);transform:rotate(-4deg);}\n  .way h4{font-family:var(--fdisp);font-weight:700;font-size:17px;margin:0;}\n  .way span{font-size:14px;color:rgb(var(--c-fgdim));}\n  .vote{margin-top:18px;background:rgb(var(--c-panel));color:rgb(var(--c-ondark));border-radius:14px;padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}\n  .vote .d{font-family:var(--fdisp);font-weight:800;font-size:30px;color:var(--m-red);line-height:1;white-space:nowrap;}\n  .vote .dwrap{flex:none;}\n  .vote .t{font-family:var(--fmono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--c-ondark),.75);}\n\n  /* Footer */\n  footer{background:rgb(var(--c-panel));color:rgba(var(--c-ondark),.72);padding:54px 0 40px;}\n  footer .frow{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-end;}\n  footer .brand{color:rgb(var(--c-ondark));}footer .brand svg{color:rgb(var(--c-ondark));}\n  footer .soc{display:flex;gap:18px;font-family:var(--fmono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}\n  footer .soc a{text-decoration:none;color:rgba(var(--c-ondark),.72);background-image:linear-gradient(var(--m-red),var(--m-red));background-size:0% 1.5px;background-position:0 100%;background-repeat:no-repeat;transition:color .2s,background-size .25s;padding-bottom:3px;}\n  footer .soc a:hover{color:var(--m-red);background-size:100% 1.5px;}\n  footer .fine{margin-top:0;padding-top:0;border-top:none;font-family:var(--fmono);font-size:11px;letter-spacing:.04em;color:rgba(var(--c-ondark),.5);line-height:1.7;}\n\n  .ph{color:var(--teal);} /* placeholder marker tint */\n\n  /* ---------- FIND YOUR STREET (hero) ---------- */\n  .finder{margin-top:26px;width:100%;max-width:440px;}\n  .finder form{display:flex;gap:8px;background:rgba(var(--c-glass),.55);border:1px solid rgba(var(--c-line),.18);border-radius:999px;padding:6px 6px 6px 18px;}\n  .finder input{flex:1;border:none;background:transparent;font-family:var(--fbody);font-size:15px;color:var(--ink);}\n  .finder input:focus{outline:none;}\n  .finder .btn{padding:10px 18px;}\n  .finder .result{margin-top:14px;font-family:var(--fmono);font-size:12.5px;letter-spacing:.04em;color:var(--teal);min-height:18px;text-align:center;opacity:0;transition:opacity .4s;}\n  .finder .result.show{opacity:1;}\n  .finder .result b{color:var(--ink);}\n\n  /* ---------- SHARE-CARD GENERATOR ---------- */\n  .sharebtn{margin-top:14px;display:inline-flex;}\n  .sharewrap{position:fixed;inset:0;z-index:82;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(33,40,38,.62);backdrop-filter:blur(4px);}\n  .sharewrap.open{display:flex;}\n  .sharebox{background:var(--sand);border-radius:20px;max-width:560px;width:100%;padding:26px;box-shadow:0 40px 90px -40px rgba(0,0,0,.6);position:relative;}\n  .sharebox .x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:24px;line-height:1;color:rgb(var(--c-fgdim));cursor:pointer;}\n  .sharebox h3{font-family:var(--fdisp);font-weight:800;font-size:22px;margin:0 4px 4px;}\n  .sharebox .sub{font-size:13.5px;color:rgb(var(--c-fgdim));margin:0 4px 16px;}\n  /* the card preview (also the capture target) */\n  .scard{background:var(--cream);border-radius:14px;overflow:hidden;border:1px solid rgba(var(--c-line),.14);}\n  .scard .top{padding:22px 24px 6px;}\n  .scard .ek{font-family:var(--fmono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--c-fgdim));}\n  .scard .nm{font-family:var(--fdisp);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:-.01em;color:var(--ink);line-height:1;margin-top:8px;}\n  .scard .msg{font-family:var(--fdisp);font-weight:500;font-size:15px;color:var(--teal);margin-top:8px;}\n  .scard .line{width:100%;display:block;}\n  .scard .foot{display:flex;justify-content:space-between;align-items:center;padding:6px 24px 16px;font-family:var(--fmono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgb(var(--c-fgdim));}\n  .share-row{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap;}\n  .share-row input{flex:1;min-width:160px;border:1px solid rgba(var(--c-line),.25);background:rgba(var(--c-glass),.6);border-radius:10px;padding:11px 14px;font-family:var(--fbody);font-size:15px;color:var(--ink);}\n  .share-row input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(var(--c-teal),.2);}\n  .share-social{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}\n  .share-social button{flex:1;min-width:96px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid rgba(var(--c-line),.2);background:rgba(var(--c-glass),.5);border-radius:10px;padding:10px 12px;cursor:pointer;font-family:var(--fmono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgb(var(--c-fgdim));transition:border-color .15s,background .15s;}\n  .share-social button:hover{border-color:var(--ink);background:rgba(var(--c-glass),.8);}\n  .share-social button svg{width:15px;height:15px;}\n\n  /* ---------- YARD-SIGN MAP ---------- */\n  .signmap{background:var(--sand2);}\n  .mapwrap{margin-top:38px;display:grid;grid-template-columns:1.4fr .6fr;gap:36px;align-items:center;}\n  .mapbox{position:relative;background:var(--sand);border:1px solid rgba(var(--c-line),.16);border-radius:18px;overflow:hidden;aspect-ratio:16/10;box-shadow:0 24px 56px -38px rgba(40,38,30,.5);}\n  .mapbox svg{width:100%;height:100%;display:block;}\n  .mapbox .grid line{stroke:rgba(var(--c-line),.08);stroke-width:1;}\n  .mapbox .street{stroke:rgba(var(--c-line),.22);stroke-width:1.4; ww,hh){\n      var inner = panoInner\n        .replace(/var\\(--m-red\\)/g,'#c25e36')\n        .replace(/var\\(--cream\\)/g,'#efe6d0')\n        .replace(/var\\(--m-people\\)/g,'#7d7d61');\n      var css='path{fill:none;stroke:#5d5036;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}'\n        +'circle{fill:none;stroke:#7d7d61;stroke-width:.8}'\n        +'[data-piece=\"pier_ground\"]{stroke:#b39563;stroke-width:3.8}'\n        +'[data-piece=\"pier_deck_water\"]{stroke:#9c6a38;stroke-width:3.8}'\n        +'[data-piece=\"piers\"]{stroke:#9c6a38;stroke-width:1.7}'\n        +'[data-piece=\"pier_rail\"]{stroke:#9c6a38;stroke-width:1.1}'\n        +'[data-piece=\"pier_bracing\"]{stroke:#9c6a38;stroke-width:.95}'\n        +'[data-piece=\"ocean\"]{stroke:#6f9a86;stroke-width:3.2}'\n        +'[data-piece=\"beach\"]{stroke:#cc9a4f;stroke-width:3.2}'\n        +'[data-piece$=\"_block\"]{stroke:#5d5036;stroke-width:2.7}'\n        +'[data-piece=\"lifeguard_tower\"]{stroke:#6d86a0;stroke-width:2.2}'\n        +'[data-piece=\"redcar\"] path{stroke:#c25e36;stroke-width:1.3}'\n        +'[data-piece=\"redcar\"] circle{stroke:#c25e36;stroke-width:1.3;fill:none}'\n        +'[data-piece=\"pedestrian\"] path,[data-piece=\"pedestrian\"] circle{fill:#7d7d61;stroke:none}'\n        +'[data-piece=\"cyclist\"] path,[data-piece=\"cyclist\"] circle{stroke:#7d7d61;stroke-width:1.1}'\n        +'[data-piece=\"seal\"] path{stroke:none}';\n      return '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"255.5 0 1543.7 166\" width=\"'+ww+'\" height=\"'+hh+'\"><style>'+css+'<\u002Fstyle>'+inner+'<\u002Fsvg>';\n    }\n    function loadPano(ww,hh){\n      return new Promise(function(res){\n        var img=new Image();\n        img.onload=function(){ res(img); }; img.onerror=function(){ res(null); };\n        img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(panoSVG(ww,hh));\n      });\n    }\n    /* draw a 1200x630 PNG of the card → returns a Promise<Blob> */\n    function renderBlob(){\n      return new Promise(function(resolve){\n        var W=1200,H=630,c=document.createElement('canvas'); c.width=W;c.height=H;\n        var x=c.getContext('2d');\n        var gg=x.createLinearGradient(0,0,0,H); gg.addColorStop(0,'#EFE6D0'); gg.addColorStop(1,'#EFE6D0');\n        x.fillStyle=gg; x.fillRect(0,0,W,H);\n        x.textBaseline='top';\n        x.fillStyle='#6a6253'; x.font='600 20px \"Spline Sans Mono\", monospace';\n        x.fillText((LANG==='es'?'YO ESTOY CON MATT · DISTRITO 1':'I’M WITH MATT · SEAL BEACH DISTRICT 1'),60,58);\n        x.fillStyle='#2E2820'; x.font='900 92px Archivo, sans-serif';\n        x.fillText(currentName().toUpperCase(),54,90);\n        x.fillStyle='#355a4c'; x.font='500 32px Archivo, sans-serif';\n        x.fillText(msgEl.textContent,60,206);\n        var pw=1080, ph=Math.round(pw*166/1543.7), px=60, py=H-ph-66;\n        loadPano(pw,ph).then(function(img){\n          if(img) x.drawImage(img,px,py,pw,ph);\n          x.textBaseline='alphabetic';\n          x.font='700 18px \"Spline Sans Mono\", monospace';\n          x.fillStyle='#355a4c'; x.fillText('MATT',60,H-32);\n          var mw=x.measureText('MATT ').width; x.fillStyle='#c25e36'; x.fillText('TERRY',60+mw,H-32);\n          x.fillStyle='#6a6253'; x.font='600 16px \"Spline Sans Mono\", monospace';\n          var fw=x.measureText('terryforsealbeach.com').width; x.fillText('terryforsealbeach.com',W-60-fw,H-32);\n          c.toBlob(function(blob){ resolve(blob); });\n        });\n      });\n    }\n    function downloadBlob(blob){\n      var url=URL.createObjectURL(blob), a=document.createElement('a');\n      a.href=url; a.download='matt-terry-district1.png'; document.body.appendChild(a); a.click();\n      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000);\n    }\n    document.getElementById('shareDownload').addEventListener('click',function(){ renderBlob().then(downloadBlob); });\n\n    var SITE_URL='https://terryforsealbeach.com';\n    var shareText=function(){ return (LANG==='es'?'Yo estoy con Matt Terry — Distrito 1 de Seal Beach. ':'I’m with Matt Terry — Seal Beach City Council, District One. ')+'#SealBeach'; };\n    // one-tap native share (with the image where supported), else download + open composer\n    document.getElementById('shareNative').addEventListener('click',function(){\n      renderBlob().then(function(blob){\n        var file=new File([blob],'matt-terry-district1.png',{type:'image/png'});\n        if(navigator.canShare && navigator.canShare({files:[file]})){\n          navigator.share({files:[file], title:'Matt Terry — District One', text:shareText(), url:SITE_URL}).catch(function(){});\n        } else if(navigator.share){\n          navigator.share({title:'Matt Terry — District One', text:shareText(), url:SITE_URL}).catch(function(){});\n        } else {\n          downloadBlob(blob);\n          alert(LANG==='es'?'Tarjeta descargada — adjúntala en tu publicación.':'Card downloaded — attach it to your post.');\n        }\n      });\n    });\n    document.getElementById('shareFb').addEventListener('click',function(){\n      renderBlob().then(downloadBlob);\n      window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(SITE_URL),'_blank','noopener,width=640,height=640');\n    });\n    document.getElementById('shareTw').addEventListener('click',function(){\n      renderBlob().then(downloadBlob);\n      window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText())+'&url='+encodeURIComponent(SITE_URL),'_blank','noopener,width=600,height=640');\n    });\n    window.__syncShareCard=syncCard;\n  })();\n\n  /* ---------- 'Join N' subtle count-up ---------- */\n  (function(){\n    var host=document.getElementById('signJoin'); if(!host) return;\n    var target=147, n=120, started=false;\n    function up(){ if(started) return; started=true; var iv=setInterval(function(){ var el=document.getElementById('joinCount'); if(!el){ clearInterval(iv); return; } n+=Math.ceil((target-n)/8); if(n>=target){n=target;clearInterval(iv);} el.textContent=n; },60); }\n    if('IntersectionObserver' in window){ var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){up();o.disconnect();}});},{threshold:.5}); o.observe(host); } else { up(); }\n  })();\n\n  /* ---------- animated count-up stats (Meet Matt) ---------- */\n  (function(){\n    var stats=document.querySelector('.stats'); if(!stats) return;\n    var nums=stats.querySelectorAll('b[data-count]');\n    var reduce=false; // unified policy: the count-up follows the hero and animates regardless of prefers-reduced-motion\n    function animate(){\n      nums.forEach(function(b){\n        var target=+b.getAttribute('data-count'), suf=b.getAttribute('data-suffix')||'';\n        if(reduce){ b.textContent=target+suf; return; }\n        var dur=1100, t0=null;\n        function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur); var val=Math.round(target*(0.5-Math.cos(p*Math.PI)/2)); b.textContent=val+suf; if(p<1) requestAnimationFrame(step); }\n        requestAnimationFrame(step);\n      });\n    }\n    if(reduce){ nums.forEach(function(b){ b.textContent=(+b.getAttribute('data-count'))+(b.getAttribute('data-suffix')||''); }); return; }\n    if('IntersectionObserver' in window){ var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){animate();o.disconnect();}});},{threshold:.5}); o.observe(stats); } else { animate(); }\n  })();\n\n  /* ---------- rail keyboard flow: arrows jump between district stops ---------- */\n  (function(){\n    var rail=document.getElementById('rail'); if(!rail) return;\n    var links=[].slice.call(rail.querySelectorAll('a'));\n    rail.addEventListener('keydown',function(e){\n      var i=links.indexOf(document.activeElement); if(i<0) return;\n      if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); var n=links[Math.min(links.length-1,i+1)]; n.focus(); n.click(); }\n      else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); var p=links[Math.max(0,i-1)]; p.focus(); p.click(); }\n    });\n  })();\n\n  /* ===================== apply language + toggle ===================== */\n  function applyI18n(lang){\n    LANG = (lang==='es') ? 'es' : 'en';\n    try{ localStorage.setItem('mt_lang', LANG); }catch(e){}\n    document.documentElement.setAttribute('lang', LANG);\n    var d=DICT[LANG];\n    document.querySelectorAll('[data-i18n]').forEach(function(el){\n      var k=el.getAttribute('data-i18n'); if(typeof d[k]==='string') el.innerHTML=d[k];\n    });\n    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){\n      var k=el.getAttribute('data-i18n-ph'); if(typeof d[k]==='string') el.setAttribute('placeholder',d[k]);\n    });\n    renderPri(); renderEndo(); setGreeting(); renderFinder();\n    if(typeof window.__syncShareCard==='function') window.__syncShareCard();\n  }\n  function toggleLang(){ applyI18n(LANG==='en'?'es':'en'); }\n  var lt=document.getElementById('langToggle'); if(lt) lt.addEventListener('click',toggleLang);\n  var ltm=document.getElementById('langToggleM'); if(ltm) ltm.addEventListener('click',toggleLang);\n  applyI18n(LANG);\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
